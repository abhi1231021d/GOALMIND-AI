server.port=${PORT:${SERVER_PORT:8080}}

# Database Configuration (Smart Zero-Setup: uses local file-persisted H2 with MySQL compatibility mode; can be pointed to MySQL via SPRING_DATASOURCE_URL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/goalmind;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Accessible at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:goalmindSecretKeyMustBeAtLeast32BytesForHMACSHA256SignatureCompliance123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# External AI Configuration (Optional - robust fallback is built in)
app.ai.api-key=${AI_API_KEY:}
app.ai.api-url=${AI_API_URL:https://api.openai.com/v1/chat/completions}
app.ai.model=${AI_MODEL:gpt-4o-mini}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:80,http://localhost,https://goalmind-ai.onrender.com,https://*.onrender.com}

# ResumeKit & Interview Simulator AI Configuration
resume.provider.api-key=${OPENAI_API_KEY:}
resume.provider.model=${OPENAI_MODEL:gpt-4o-mini}
resume.provider.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
ai.base-url=${AI_BASE_URL:http://localhost:11434/v1}
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:llama3.2}
ai.timeout-ms=${AI_TIMEOUT_MS:8000}
