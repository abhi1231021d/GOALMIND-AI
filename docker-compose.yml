version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: goalmind-mysql
    restart: always
    environment:
      MYSQL_DATABASE: goalmind_db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - goalmind-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: goalmind-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/goalmind_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      JWT_EXPIRATION_MS: 86400000
      AI_PROVIDER: openai
      AI_API_KEY: ${AI_API_KEY:-}
    ports:
      - "8080:8080"
    networks:
      - goalmind-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: goalmind-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "3000:80"
    networks:
      - goalmind-net

volumes:
  mysql_data:

networks:
  goalmind-net:
    driver: bridge
