services:
  # GoalMind AI Frontend (Static Site on Render)
  - type: web
    name: goalmind-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # GoalMind AI Backend (Java Spring Boot Web Service on Render)
  - type: web
    name: goalmind-backend
    runtime: java
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/goalmind-backend-1.0.0.jar
    envVars:
      - key: PORT
        value: 8080
